name: Submit IndexNow URLs

# Signale toutes les pages du plan du site publié à IndexNow (Bing, Yandex, Seznam…).
# À lancer à la main (Actions → Submit IndexNow URLs → Run workflow) après un changement de pages :
# IndexNow demande de ne signaler que des pages nouvelles ou modifiées, pas à chaque fusion.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Submit sitemap URLs to IndexNow
        run: python scripts/indexnow_submit.py
