name: SEO Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: seo-monitor
  cancel-in-progress: true

jobs:
  technical-seo:
    name: Technical SEO health check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Audit public website
        id: audit
        run: python scripts/seo_monitor.py > seo-report.json
      - name: Publish SEO report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teranga-ai-seo-report
          path: seo-report.json
          if-no-files-found: warn
          retention-days: 30
