name: SEO Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: seo-monitor
  cancel-in-progress: true

jobs:
  technical-seo:
    name: Technical SEO health check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Audit public website
        id: audit
        run: python scripts/seo_monitor.py > seo-report.json
      - name: Publish SEO report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: teranga-ai-seo-report
          path: seo-report.json
          if-no-files-found: warn
          retention-days: 30
