name: SEO Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: seo-monitor
  cancel-in-progress: true

jobs:
  technical-seo:
    name: Technical SEO health check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit public website
        id: audit
        run: python scripts/seo_monitor.py > seo-report.json
      - name: Publish SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teranga-ai-seo-report
          path: seo-report.json
          if-no-files-found: warn
          retention-days: 30
