name: tests
# CI verification

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # Même version que la production (Render construit avec Python 3.14).
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      # Ruff et Bandit viennent de requirements-dev.txt : une seule source pour le CI et les développeurs.
      - name: Analyse du code (erreurs de syntaxe, noms inconnus, imports inutiles)
        run: ruff check --select E9,F63,F7,F82,F401,F811,F841 .
      - name: Analyse de sécurité du code (failles courantes, niveau moyen et plus)
        run: bandit -q -r app.py routes services -ll
      - name: Tests et couverture (le seuil empêche la couverture de baisser sans qu'on le voie)
        run: pytest -q --cov=app --cov=routes --cov=services --cov-report=term-missing:skip-covered --cov-fail-under=85
      - name: Audit des dépendances (vulnérabilités connues)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  e2e:
    # Clics réels dans Chromium sur les pages principales (chat, planificateur, partage…).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # Même version que la production (Render construit avec Python 3.14).
          python-version: "3.14"
      - run: pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/e2e -rs
        env:
          E2E_REQUIRED: "1"
