name: tests
# CI verification

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Audit des dépendances (vulnérabilités connues)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
