name: tests
# CI verification

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Analyse du code (erreurs de syntaxe, noms inconnus, imports inutiles)
        run: |
          pip install "ruff>=0.6"
          ruff check --select E9,F63,F7,F82,F401,F811,F841 .
      - name: Analyse de sécurité du code (failles courantes, niveau moyen et plus)
        run: |
          pip install bandit
          bandit -q -r app.py routes services -ll
      - name: Tests et couverture (le seuil empêche la couverture de baisser sans qu'on le voie)
        run: pytest -q --cov=app --cov=routes --cov=services --cov-report=term-missing:skip-covered --cov-fail-under=85
      - name: Audit des dépendances (vulnérabilités connues)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  e2e:
    # Clics réels dans Chromium sur les pages principales (chat, planificateur, partage…).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt "playwright>=1.47,<2"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/e2e -rs
        env:
          E2E_REQUIRED: "1"
