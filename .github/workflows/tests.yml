name: tests
# CI verification

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Audit des dépendances (vulnérabilités connues)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  e2e:
    # Clics réels dans Chromium sur les pages principales (chat, planificateur, partage…).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt "playwright>=1.47,<2"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/e2e -rs
        env:
          E2E_REQUIRED: "1"
