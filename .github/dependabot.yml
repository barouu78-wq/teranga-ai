# Mises à jour automatiques des bibliothèques : une seule demande groupée par semaine
# (les mises à jour de sécurité, elles, arrivent aussitôt). Chaque demande passe les tests.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
