services:
  - type: web
    name: teranga-ai
    runtime: python
    plan: starter
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 75 app:app
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: TRUST_PROXY
        value: "1"
      - key: SITE_URL
        sync: false
